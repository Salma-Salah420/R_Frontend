<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - Modern E-Commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-shopping-bag"></i>
                <span>ShopHub</span>
            </div>
            
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Search products..." class="search-input">
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="navbar-actions">
                <div class="nav-item">
                    <button id="cartBtn" class="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cartCount" class="cart-count">0</span>
                    </button>
                </div>
                
                <div class="nav-item user-menu">
                    <button id="userBtn" class="user-btn">
                        <i class="fas fa-user-circle"></i>
                        <span id="userName" class="user-name">Guest</span>
                    </button>
                    <div id="userDropdown" class="dropdown-menu hidden">
                        <a href="orders.html"><i class="fas fa-list"></i> Orders</a>
                        <div id="adminLink" class="hidden">
                            <a href="admin.html"><i class="fas fa-cog"></i> Admin Panel</a>
                        </div>
                        <hr>
                        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        <a href="login.html" id="loginLink"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Filters Section -->
        <aside class="filters-panel">
            <div class="filter-group">
                <h3><i class="fas fa-filter"></i> Filters</h3>
                
                <div class="filter-item">
                    <label for="categoryFilter"><strong>Category</strong></label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label><strong>Price Range</strong></label>
                    <div class="price-range">
                        <input type="number" id="minPrice" placeholder="Min" class="price-input">
                        <input type="number" id="maxPrice" placeholder="Max" class="price-input">
                        <button id="applyPriceBtn" class="btn btn-secondary">Apply</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Products Section -->
        <section class="products-section">
            <div class="section-header">
                <h1>Featured Products</h1>
                <div class="sort-controls">
                    <select id="sortSelect" class="sort-select">
                        <option value="newest">Newest</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="popular">Most Popular</option>
                    </select>
                </div>
            </div>

            <div id="productsGrid" class="products-grid">
                <!-- Products will be loaded here -->
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button id="prevBtn" class="btn btn-outline">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span id="pageInfo" class="page-info">Page 1</span>
                <button id="nextBtn" class="btn btn-outline">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner hidden">
        <div class="spinner-content">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Modal for Product Details -->
    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modalImage" src="" alt="Product">
                </div>
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription" class="modal-description"></p>
                    <div class="modal-meta">
                        <div class="meta-item">
                            <span class="meta-label">Category:</span>
                            <span id="modalCategory"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Stock:</span>
                            <span id="modalStock"></span>
                        </div>
                    </div>
                    <div class="modal-price">
                        <span class="price-label">Price</span>
                        <span id="modalPrice" class="price-value"></span>
                    </div>
                    <div class="modal-actions">
                        <input type="number" id="quantityInput" min="1" value="1" class="quantity-input">
                        <button id="addToCartBtn" class="btn btn-primary">
                            <i class="fas fa-shopping-cart"></i> Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
