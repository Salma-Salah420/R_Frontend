<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <i class="fas fa-shopping-bag"></i>
                <span>ShopHub</span>
            </a>
            
            <div class="navbar-actions">
                <div class="nav-item user-menu">
                    <button id="userBtn" class="user-btn">
                        <i class="fas fa-user-circle"></i>
                        <span id="userName" class="user-name">Guest</span>
                    </button>
                    <div id="userDropdown" class="dropdown-menu hidden">
                        <a href="orders.html"><i class="fas fa-list"></i> Orders</a>
                        <div id="adminLink" class="hidden">
                            <a href="admin.html"><i class="fas fa-cog"></i> Admin Panel</a>
                        </div>
                        <hr>
                        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        <a href="login.html" id="loginLink"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="cart-container">
        <div class="cart-header">
            <h1><i class="fas fa-shopping-cart"></i> Shopping Cart</h1>
            <p id="cartStatus" class="cart-status">Your cart is empty</p>
        </div>

        <div class="cart-content">
            <div class="cart-items-section">
                <div id="emptyCartMessage" class="empty-message">
                    <i class="fas fa-inbox"></i>
                    <h2>Your cart is empty</h2>
                    <p>Add some products to get started!</p>
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-shopping-bag"></i> Continue Shopping
                    </a>
                </div>

                <div id="cartItemsContainer" class="cart-items-list hidden">
                    <!-- Cart items will be rendered here -->
                </div>
            </div>

            <aside class="cart-summary">
                <div class="summary-card">
                    <h2>Order Summary</h2>
                    
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotalPrice" class="price">$0.00</span>
                    </div>
                    
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span class="price">Free</span>
                    </div>
                    
                    <div class="summary-row">
                        <span>Tax (10%)</span>
                        <span id="taxPrice" class="price">$0.00</span>
                    </div>
                    
                    <hr class="summary-divider">
                    
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="totalPrice" class="price">$0.00</span>
                    </div>
                    
                    <button id="checkoutBtn" class="btn btn-primary btn-full" style="margin-top: 20px;">
                        <i class="fas fa-credit-card"></i> Proceed to Checkout
                    </button>
                    
                    <a href="index.html" class="btn btn-outline btn-full" style="margin-top: 10px;">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </aside>
        </div>
    </main>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner hidden">
        <div class="spinner-content">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/app.js"></script>
    <script>
        // Initialize cart page
        window.addEventListener('load', async () => {
            await window.app.loadCart();
        });
    </script>
</body>
</html>
